<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ee" />
  <title>Kid & Point｜孩子成長點數</title>
  <style>
    :root{--bg:#f6f4ee;--panel:#fff;--ink:#1e2b28;--muted:#6e7b77;--line:#dfe5df;--green:#2e6a55;--lime:#dff0b8;--gold:#f2c96d;--blue:#d9ebf5;--red:#b95145;--shadow:0 14px 45px rgba(45,62,56,.09);--r:24px}
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f8f6f0,#eef3ed);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Noto Sans TC",system-ui,-apple-system,sans-serif;min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:20px 18px 90px}.topbar{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:16px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:var(--shadow)}.brand h1{font-size:20px;margin:0}.brand small{color:var(--muted)}
    .role-switch{background:#e8ece6;padding:5px;border-radius:999px;display:flex}.role-switch button{border:0;background:transparent;padding:9px 15px;border-radius:999px;color:var(--muted)}.role-switch button.active{background:#fff;color:var(--ink);box-shadow:0 4px 15px rgba(0,0,0,.08)}
    .sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}.dot{width:9px;height:9px;border-radius:50%;background:#d29b2d}.dot.online{background:#39a66b}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}.hero{padding:24px;background:linear-gradient(135deg,#234f43,#39735e);color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);right:-65px;top:-55px}.eyebrow{font-size:13px;opacity:.78}.hero h2{font-size:30px;margin:7px 0 4px}.points{font-size:48px;font-weight:850;letter-spacing:-2px}.points span{font-size:16px;font-weight:600;letter-spacing:0;opacity:.8}.progress{height:10px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin:14px 0 7px}.progress>i{display:block;height:100%;background:var(--lime);border-radius:99px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.mini{background:#f7f8f5;border:1px solid var(--line);border-radius:18px;padding:14px}.mini b{font-size:22px}.mini small{display:block;color:var(--muted);margin-top:4px}.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0 12px;padding-bottom:3px}.tab{border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px;white-space:nowrap}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.section-title{font-size:18px;margin:0 0 12px}.task{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.icon{width:42px;height:42px;flex:0 0 42px;border-radius:15px;background:var(--blue);display:grid;place-items:center;font-size:20px}.task-main{flex:1}.task h4{margin:1px 0 5px;font-size:15px}.meta{font-size:12px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#eef2ed;font-size:11px;color:var(--muted);margin-right:5px}.pt{font-weight:800;color:var(--green)}.btn{border:0;border-radius:13px;padding:9px 12px;background:var(--ink);color:#fff}.btn.secondary{background:#edf1ed;color:var(--ink)}.btn.green{background:var(--green)}.btn.danger{background:#f7e8e5;color:var(--red)}.btn:disabled{opacity:.45;cursor:not-allowed}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{border:1px solid var(--line);background:#f9faf8;border-radius:18px;padding:15px;text-align:left}.quick span{font-size:22px;display:block;margin-bottom:8px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.history{max-height:340px;overflow:auto}.history-item{display:flex;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}.history-item:last-child{border:0}.pos{color:#23815b;font-weight:800}.neg{color:#b95145;font-weight:800}.resource{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}.resource a{color:var(--green);font-weight:700;text-decoration:none}.view{display:none}.view.active{display:block}.modal-wrap{position:fixed;inset:0;background:rgba(20,30,27,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}.modal-wrap.open{display:flex}.modal{width:min(620px,100%);background:#fff;border-radius:26px 26px 0 0;padding:20px;max-height:88vh;overflow:auto}.modal h3{margin:0 0 14px}.field{margin:12px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff}.field textarea{min-height:86px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.notice{background:#fff5d9;border:1px solid #eddca7;padding:10px 12px;border-radius:14px;font-size:12px;color:#725d1c;margin-bottom:12px}.student-select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px}.feedback{background:#f8f5ff;border:1px solid #e7ddf4;border-radius:16px;padding:12px;margin-bottom:9px}.feedback p{margin:5px 0;font-size:13px}.hidden{display:none!important}
    @media(max-width:800px){.app{padding:14px 12px 80px}.topbar{align-items:flex-start;flex-wrap:wrap}.sync{order:3;width:100%}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}.hero h2{font-size:25px}.points{font-size:40px}.role-switch button{padding:8px 11px}.panel{padding:16px;border-radius:21px}.quick{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">✦</div><div><h1>Kid & Point</h1><small>把成長變成看得見的累積</small></div></div>
    <div class="role-switch"><button id="teacherBtn" class="active">老師端</button><button id="parentBtn">家長端</button></div>
    <div class="sync"><i class="dot" id="syncDot"></i><span id="syncText">Demo 單機模式</span><button class="btn secondary" id="setupBtn" style="padding:6px 9px">同步設定</button></div>
  </header>

  <div class="row between" style="margin-bottom:12px">
    <div><b>目前學生</b> <span class="meta">可切換個別狀態</span></div>
    <select id="studentSelect" class="student-select"></select>
  </div>

  <main id="teacherView" class="view active">
    <div class="grid">
      <section>
        <div class="panel hero">
          <div class="eyebrow">今日成長總覽</div><h2 id="tName">宇傑</h2>
          <div class="points"><span id="tPoints">0</span> <span>POINTS</span></div>
          <div class="progress"><i id="tProgress" style="width:0%"></i></div>
          <div class="row between"><small>本週目標 100 點</small><small id="weekText">0 / 100</small></div>
        </div>
        <div class="cards">
          <div class="mini"><b id="todayEarn">0</b><small>今日獲得</small></div>
          <div class="mini"><b id="doneCount">0</b><small>已完成任務</small></div>
          <div class="mini"><b id="streakCount">0</b><small>連續成長日</small></div>
        </div>

        <div class="tabs" id="teacherTabs">
          <button class="tab active" data-tab="active">進行中</button><button class="tab" data-tab="verify">待核實</button><button class="tab" data-tab="done">已完成</button><button class="tab" data-tab="history">歷史紀錄</button>
        </div>
        <div class="panel" id="teacherList"></div>
      </section>

      <aside>
        <section class="panel">
          <h3 class="section-title">老師工具</h3>
          <div class="quick">
            <button data-open="task"><span>＋</span><b>發佈任務</b><div class="meta">指定學生、點數與期限</div></button>
            <button data-open="quickPoint"><span>★</span><b>即時加點</b><div class="meta">表現優秀直接記錄</div></button>
            <button data-open="student"><span>☺</span><b>新增學生</b><div class="meta">建立個別成長檔案</div></button>
            <button data-open="redeem"><span>✓</span><b>核實兌換</b><div class="meta">確認獎品已領取</div></button>
          </div>
        </section>
        <section class="panel" style="margin-top:18px"><h3 class="section-title">最近點數異動</h3><div id="teacherHistory" class="history"></div></section>
      </aside>
    </div>
  </main>

  <main id="parentView" class="view">
    <div class="grid">
      <section>
        <div class="panel hero">
          <div class="eyebrow">孩子目前狀態</div><h2 id="pName">宇傑</h2>
          <div class="points"><span id="pPoints">0</span> <span>POINTS</span></div>
          <div class="progress"><i id="pProgress" style="width:0%"></i></div>
          <div class="row between"><small>下一個獎勵可以一起規劃</small><small id="pWeekText">本週 0 點</small></div>
        </div>
        <div class="tabs" id="parentTabs"><button class="tab active" data-tab="tasks">任務</button><button class="tab" data-tab="completed">完成紀錄</button><button class="tab" data-tab="rewards">獎品商店</button><button class="tab" data-tab="feedback">孩子回饋</button></div>
        <div class="panel" id="parentList"></div>
      </section>
      <aside>
        <section class="panel">
          <h3 class="section-title">家長操作</h3>
          <div class="quick">
            <button data-open="reward"><span>🎁</span><b>新增獎品</b><div class="meta">自訂點數與內容</div></button>
            <button data-open="feedback"><span>💬</span><b>記錄回饋</b><div class="meta">孩子今天怎麼想</div></button>
          </div>
        </section>
        <section class="panel" style="margin-top:18px"><h3 class="section-title">學習探索</h3><div id="resources"></div></section>
      </aside>
    </div>
  </main>
</div>

<div class="modal-wrap" id="modalWrap"><div class="modal"><div id="modalBody"></div></div></div>

<script type="module">
const seed={students:[{id:'yu-jie',name:'宇傑',points:30,createdAt:Date.now()}],tasks:[
{id:'t1',studentId:'yu-jie',title:'完成今日指定喝水量',category:'健康作息',sub:'飲食',points:10,status:'active',createdAt:Date.now()-3600000},
{id:'t2',studentId:'yu-jie',title:'數學作業表現傑出',category:'學科優秀',sub:'數學',points:10,status:'done',completedAt:Date.now()-7200000,verifiedAt:Date.now()-7000000,createdAt:Date.now()-9000000},
{id:'t3',studentId:'yu-jie',title:'主動整理自己的書桌',category:'健康作息',sub:'自動自發',points:10,status:'verify',completedAt:Date.now()-1800000,createdAt:Date.now()-5000000}
],rewards:[{id:'r1',studentId:'yu-jie',title:'週末多 30 分鐘遊戲時間',cost:50,createdAt:Date.now()}],redemptions:[],feedback:[],ledger:[{id:'l1',studentId:'yu-jie',amount:10,reason:'數學作業表現傑出',createdAt:Date.now()-7000000},{id:'l2',studentId:'yu-jie',amount:20,reason:'初始成長點數',createdAt:Date.now()-86400000}]};
const builtins=[
['健康作息','完成今日指定喝水量','飲食',10],['健康作息','準時睡覺／起床','自主訓練',10],['健康作息','主動完成自己的事情','自動自發',10],['健康作息','寫下今天的一個感悟','感悟思考',10],['健康作息','完成每日運動','每日運動',10],
['學科優秀','今日作業表現傑出','作業',10],['學科優秀','考試達成個人目標','傳統考試',20],['學科優秀','完成額外學習挑戰','學習成就',15],['學科優秀','主動協助同學理解題目','學習成就',10]
];
const resourceData=[['Khan Academy','數學、科學與程式學習','https://www.khanacademy.org/'],['Code.org','用遊戲方式學程式','https://code.org/'],['NASA Space Place','兒童太空與地球科學','https://spaceplace.nasa.gov/'],['GeoGebra','互動數學與幾何','https://www.geogebra.org/'],['PhET','科學與數學互動模擬','https://phet.colorado.edu/zh_TW/']];
let state=loadLocal(); let db=null, firestore=null, remote=false, unsub=[]; let teacherTab='active',parentTab='tasks',currentStudent=state.students[0]?.id;
function cloneSeed(){return JSON.parse(JSON.stringify(seed))} function loadLocal(){try{return JSON.parse(localStorage.getItem('kidpoint-data'))||cloneSeed()}catch{return cloneSeed()}}
function persist(){localStorage.setItem('kidpoint-data',JSON.stringify(state)); if(remote) pushAll(); render()}
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t)):'—';
function student(){return state.students.find(s=>s.id===currentStudent)||state.students[0]}
function tasks(){return state.tasks.filter(t=>t.studentId===currentStudent)} function ledger(){return state.ledger.filter(x=>x.studentId===currentStudent).sort((a,b)=>b.createdAt-a.createdAt)}
function todayAmount(){let d=new Date();d.setHours(0,0,0,0);return ledger().filter(x=>x.createdAt>=d.getTime()&&x.amount>0).reduce((a,b)=>a+b.amount,0)}
function weekAmount(){let d=new Date();let day=(d.getDay()+6)%7;d.setHours(0,0,0,0);d.setDate(d.getDate()-day);return ledger().filter(x=>x.createdAt>=d.getTime()&&x.amount>0).reduce((a,b)=>a+b.amount,0)}
function render(){if(!student())return; $('#studentSelect').innerHTML=state.students.map(s=>`<option value="${s.id}" ${s.id===currentStudent?'selected':''}>${esc(s.name)}</option>`).join(''); let s=student(),wa=weekAmount();
['#tName','#pName'].forEach(x=>$(x).textContent=s.name); ['#tPoints','#pPoints'].forEach(x=>$(x).textContent=s.points||0); $('#tProgress').style.width=Math.min(100,wa)+'%';$('#pProgress').style.width=Math.min(100,wa)+'%';$('#weekText').textContent=`${wa} / 100`;$('#pWeekText').textContent=`本週 ${wa} 點`;$('#todayEarn').textContent=todayAmount();$('#doneCount').textContent=tasks().filter(t=>t.status==='done').length;$('#streakCount').textContent=calcStreak(); renderTeacher();renderParent();renderHistory();renderResources()}
function calcStreak(){let days=new Set(ledger().filter(x=>x.amount>0).map(x=>new Date(x.createdAt).toDateString()));let n=0,d=new Date();for(let i=0;i<30;i++){if(days.has(d.toDateString()))n++;else if(i>0)break;d.setDate(d.getDate()-1)}return n}
function taskCard(t,teacher=true){let action=''; if(teacher&&t.status==='verify')action=`<button class="btn green" data-verify="${t.id}">核實＋${t.points}</button>`; if(!teacher&&t.status==='active')action=`<button class="btn" data-complete="${t.id}">回報完成</button>`; let status={active:'進行中',verify:'待老師核實',done:'已完成'}[t.status];return `<div class="task"><div class="icon">${t.category==='健康作息'?'☀':'✎'}</div><div class="task-main"><h4>${esc(t.title)}</h4><div><span class="badge">${esc(t.category)}</span><span class="badge">${esc(t.sub||'一般')}</span></div><div class="meta" style="margin-top:6px">${status}${t.completedAt?' · 完成 '+fmt(t.completedAt):''}</div></div><div style="text-align:right"><div class="pt">+${t.points}</div><div style="margin-top:7px">${action}</div></div></div>`}
function renderTeacher(){let list=$('#teacherList');if(teacherTab==='history'){list.innerHTML='<h3 class="section-title">完整歷史紀錄</h3>'+historyHTML(100);return}let arr=tasks().filter(t=>t.status===teacherTab);list.innerHTML=`<h3 class="section-title">${teacherTab==='active'?'進行中的任務':teacherTab==='verify'?'等待老師核實':'已完成任務'}</h3>`+(arr.length?arr.sort((a,b)=>(b.completedAt||b.createdAt)-(a.completedAt||a.createdAt)).map(t=>taskCard(t,true)).join(''):'<div class="empty">目前沒有項目</div>')}
function renderParent(){let list=$('#parentList'); if(parentTab==='tasks'){let a=tasks().filter(t=>t.status!=='done');list.innerHTML='<h3 class="section-title">已發佈任務</h3>'+(a.length?a.map(t=>taskCard(t,false)).join(''):'<div class="empty">目前沒有進行中的任務</div>')} else if(parentTab==='completed'){let a=tasks().filter(t=>t.status==='done');list.innerHTML='<h3 class="section-title">完成紀錄</h3>'+(a.length?a.map(t=>taskCard(t,false)).join(''):'<div class="empty">尚無完成紀錄</div>')} else if(parentTab==='rewards'){let rs=state.rewards.filter(r=>r.studentId===currentStudent);list.innerHTML='<h3 class="section-title">獎品商店</h3>'+(rs.length?rs.map(r=>`<div class="task"><div class="icon">🎁</div><div class="task-main"><h4>${esc(r.title)}</h4><div class="meta">需要 ${r.cost} 點</div></div><button class="btn" data-request-redeem="${r.id}" ${student().points<r.cost?'disabled':''}>兌換</button></div>`).join(''):'<div class="empty">還沒有設定獎品</div>')} else {let fs=state.feedback.filter(f=>f.studentId===currentStudent).sort((a,b)=>b.createdAt-a.createdAt);list.innerHTML='<h3 class="section-title">孩子回饋與成長筆記</h3>'+(fs.length?fs.map(f=>`<div class="feedback"><b>${esc(f.mood||'今日回饋')}</b><p>${esc(f.text)}</p><span class="meta">${fmt(f.createdAt)}</span></div>`).join(''):'<div class="empty">還沒有回饋紀錄</div>')}}
function historyHTML(limit=15){let h=ledger().slice(0,limit);return h.length?h.map(x=>`<div class="history-item"><div><b>${esc(x.reason)}</b><div class="meta">${fmt(x.createdAt)}</div></div><span class="${x.amount>=0?'pos':'neg'}">${x.amount>=0?'+':''}${x.amount}</span></div>`).join(''):'<div class="empty">尚無點數紀錄</div>'}
function renderHistory(){$('#teacherHistory').innerHTML=historyHTML()} function renderResources(){$('#resources').innerHTML=resourceData.map(r=>`<div class="resource"><div><b>${r[0]}</b><div class="meta">${r[1]}</div></div><a href="${r[2]}" target="_blank" rel="noopener">前往 ↗</a></div>`).join('')}
function award(amount,reason){let s=student();s.points=Math.max(0,(s.points||0)+amount);state.ledger.push({id:crypto.randomUUID(),studentId:s.id,amount,reason,createdAt:Date.now()})}
function openModal(type){let body=$('#modalBody'),s=student(); if(type==='task'){body.innerHTML=`<h3>發佈新任務</h3><div class="field"><label>使用內建任務</label><select id="builtin"><option value="">自訂任務</option>${builtins.map((b,i)=>`<option value="${i}">${b[0]}｜${b[1]} (+${b[3]})</option>`).join('')}</select></div><div class="field"><label>任務名稱</label><input id="taskTitle" placeholder="例如：完成今日指定喝水量"></div><div class="row"><div class="field" style="flex:1"><label>分類</label><select id="taskCat"><option>健康作息</option><option>學科優秀</option><option>其他成長</option></select></div><div class="field" style="flex:1"><label>子分類</label><input id="taskSub" placeholder="每日運動／數學"></div></div><div class="field"><label>完成可得點數</label><input id="taskPoints" type="number" min="1" value="10"></div><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn green" id="saveTask">發佈</button></div>`; setTimeout(()=>{$('#builtin').onchange=e=>{let b=builtins[e.target.value];if(!b)return;$('#taskTitle').value=b[1];$('#taskCat').value=b[0];$('#taskSub').value=b[2];$('#taskPoints').value=b[3]};$('#saveTask').onclick=()=>{let title=$('#taskTitle').value.trim();if(!title)return;state.tasks.push({id:crypto.randomUUID(),studentId:s.id,title,category:$('#taskCat').value,sub:$('#taskSub').value,points:+$('#taskPoints').value||10,status:'active',createdAt:Date.now()});persist();closeModal()}})}
else if(type==='quickPoint'){body.innerHTML=`<h3>即時加點</h3><div class="field"><label>表現描述</label><input id="pointReason" placeholder="例如：作業表現傑出"></div><div class="field"><label>點數</label><input id="pointAmount" type="number" value="10"></div><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn green" id="savePoint">確認加點</button></div>`;setTimeout(()=>$('#savePoint').onclick=()=>{let r=$('#pointReason').value.trim(),a=+$('#pointAmount').value;if(!r||!a)return;award(a,r);persist();closeModal()})}
else if(type==='student'){body.innerHTML=`<h3>新增學生</h3><div class="field"><label>姓名</label><input id="studentName" placeholder="輸入孩子姓名"></div><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn green" id="saveStudent">建立</button></div>`;setTimeout(()=>$('#saveStudent').onclick=()=>{let n=$('#studentName').value.trim();if(!n)return;let id=crypto.randomUUID();state.students.push({id,name:n,points:0,createdAt:Date.now()});currentStudent=id;persist();closeModal()})}
else if(type==='reward'){body.innerHTML=`<h3>新增獎品</h3><div class="field"><label>獎品內容</label><input id="rewardTitle" placeholder="例如：週末多 30 分鐘遊戲時間"></div><div class="field"><label>需要點數</label><input id="rewardCost" type="number" min="1" value="50"></div><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn green" id="saveReward">儲存獎品</button></div>`;setTimeout(()=>$('#saveReward').onclick=()=>{let t=$('#rewardTitle').value.trim(),c=+$('#rewardCost').value;if(!t||!c)return;state.rewards.push({id:crypto.randomUUID(),studentId:s.id,title:t,cost:c,createdAt:Date.now()});persist();closeModal()})}
else if(type==='feedback'){body.innerHTML=`<h3>記錄孩子回饋</h3><div class="field"><label>今天的感受</label><select id="mood"><option>😊 開心</option><option>😌 平靜</option><option>😣 有點累</option><option>😤 挫折</option><option>💡 有新的想法</option></select></div><div class="field"><label>孩子怎麼說／家長觀察</label><textarea id="feedbackText" placeholder="今天哪件事最有成就感？哪裡希望有人幫忙？"></textarea></div><div class="actions"><button class="btn secondary" data-close>取消</button><button class="btn green" id="saveFeedback">保存</button></div>`;setTimeout(()=>$('#saveFeedback').onclick=()=>{let t=$('#feedbackText').value.trim();if(!t)return;state.feedback.push({id:crypto.randomUUID(),studentId:s.id,mood:$('#mood').value,text:t,createdAt:Date.now()});persist();closeModal()})}
else if(type==='redeem'){let rr=state.redemptions.filter(r=>r.studentId===s.id&&r.status==='pending');body.innerHTML=`<h3>核實獎品兌換</h3>${rr.length?rr.map(r=>{let rw=state.rewards.find(x=>x.id===r.rewardId);return `<div class="task"><div class="icon">🎁</div><div class="task-main"><h4>${esc(rw?.title||'獎品')}</h4><div class="meta">${rw?.cost||0} 點 · ${fmt(r.createdAt)}</div></div><button class="btn green" data-confirm-redeem="${r.id}">確認</button></div>`}).join(''):'<div class="empty">目前沒有待核實兌換</div>'}<div class="actions"><button class="btn secondary" data-close>關閉</button></div>`}
else if(type==='setup'){let cfg=localStorage.getItem('kidpoint-firebase-config')||'';body.innerHTML=`<h3>即時同步設定</h3><div class="notice">GitHub Pages 只負責顯示網頁。要讓老師端與家長端跨裝置即時同步，需要建立 Firebase 專案並啟用 Firestore。貼上 Firebase Web App 的 config JSON 後，本頁會使用 Firestore 即時監聽。</div><div class="field"><label>Firebase config JSON</label><textarea id="firebaseCfg" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...",...}'>${esc(cfg)}</textarea></div><div class="actions"><button class="btn danger" id="clearCfg">改回 Demo</button><button class="btn secondary" data-close>取消</button><button class="btn green" id="saveCfg">儲存並連線</button></div>`;setTimeout(()=>{$('#saveCfg').onclick=()=>{try{JSON.parse($('#firebaseCfg').value);localStorage.setItem('kidpoint-firebase-config',$('#firebaseCfg').value);location.reload()}catch{alert('JSON 格式不正確')}};$('#clearCfg').onclick=()=>{localStorage.removeItem('kidpoint-firebase-config');location.reload()}})}
$('#modalWrap').classList.add('open')}
function closeModal(){$('#modalWrap').classList.remove('open')}

document.addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openModal(b.dataset.open);if(e.target.closest('[data-close]'))closeModal();let v=e.target.closest('[data-verify]');if(v){let t=state.tasks.find(x=>x.id===v.dataset.verify);if(t&&t.status==='verify'){t.status='done';t.verifiedAt=Date.now();award(t.points,t.title);persist()}}let c=e.target.closest('[data-complete]');if(c){let t=state.tasks.find(x=>x.id===c.dataset.complete);if(t&&t.status==='active'){t.status='verify';t.completedAt=Date.now();persist()}}let rr=e.target.closest('[data-request-redeem]');if(rr){let r=state.rewards.find(x=>x.id===rr.dataset.requestRedeem);if(r&&student().points>=r.cost){state.redemptions.push({id:crypto.randomUUID(),studentId:currentStudent,rewardId:r.id,status:'pending',createdAt:Date.now()});persist();alert('已送出兌換申請，等待老師核實')}}let cr=e.target.closest('[data-confirm-redeem]');if(cr){let x=state.redemptions.find(r=>r.id===cr.dataset.confirmRedeem),rw=state.rewards.find(r=>r.id===x?.rewardId);if(x&&rw&&x.status==='pending'&&student().points>=rw.cost){x.status='done';x.verifiedAt=Date.now();award(-rw.cost,'兌換：'+rw.title);persist();openModal('redeem')}}});
$('#teacherBtn').onclick=()=>switchRole('teacher');$('#parentBtn').onclick=()=>switchRole('parent');function switchRole(r){$('#teacherView').classList.toggle('active',r==='teacher');$('#parentView').classList.toggle('active',r==='parent');$('#teacherBtn').classList.toggle('active',r==='teacher');$('#parentBtn').classList.toggle('active',r==='parent')}
$('#teacherTabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;teacherTab=b.dataset.tab;[...$('#teacherTabs').children].forEach(x=>x.classList.toggle('active',x===b));renderTeacher()};$('#parentTabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;parentTab=b.dataset.tab;[...$('#parentTabs').children].forEach(x=>x.classList.toggle('active',x===b));renderParent()};$('#studentSelect').onchange=e=>{currentStudent=e.target.value;render()};$('#setupBtn').onclick=()=>openModal('setup');$('#modalWrap').onclick=e=>{if(e.target===$('#modalWrap'))closeModal()};

async function initFirebase(){let raw=localStorage.getItem('kidpoint-firebase-config');if(!raw){render();return}try{let cfg=JSON.parse(raw);let appMod=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js');firestore=await import('https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js');let app=appMod.initializeApp(cfg);db=firestore.getFirestore(app);remote=true;$('#syncDot').classList.add('online');$('#syncText').textContent='Firestore 即時同步中';const ref=firestore.doc(db,'kidpoint','shared');unsub.push(firestore.onSnapshot(ref,snap=>{if(snap.exists()){state=snap.data();if(!state.students?.find(x=>x.id===currentStudent))currentStudent=state.students?.[0]?.id;localStorage.setItem('kidpoint-data',JSON.stringify(state));render()}else pushAll()}));}catch(err){console.error(err);$('#syncText').textContent='同步連線失敗 · 使用 Demo';remote=false;render()}}
let pushing=false;async function pushAll(){if(!remote||!db||pushing)return;pushing=true;try{await firestore.setDoc(firestore.doc(db,'kidpoint','shared'),state,{merge:false})}catch(e){console.error(e)}finally{pushing=false}}
render();initFirebase();
</script>
</body>
</html>
