name: Firebase Login E2E Temp

on:
  push:
    paths:
      - '.github/workflows/firebase-login-e2e-temp.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test auth token against Firestore
        run: |
          python - <<'PY'
          import json,re,time,urllib.request,urllib.error
          text=open('firebase-config.js',encoding='utf-8').read()
          def pick(name):
              m=re.search(rf'{name}:\s*"([^"]+)"',text)
              return m.group(1) if m else ''
          key=pick('apiKey'); project=pick('projectId')
          def call(req):
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,json.loads(r.read().decode() or '{}')
              except urllib.error.HTTPError as e:
                  raw=e.read().decode()
                  try:data=json.loads(raw or '{}')
                  except:data={'raw':raw}
                  return e.code,data
          email=f'kidpoint-e2e-{int(time.time())}@example.invalid'
          password='KidPoint-E2E-Temp-928374'
          signup=f'https://identitytoolkit.googleapis.com/v1/accounts:signUp?key={key}'
          body=json.dumps({'email':email,'password':password,'returnSecureToken':True}).encode()
          s,d=call(urllib.request.Request(signup,data=body,headers={'Content-Type':'application/json'},method='POST'))
          print('SIGNUP_HTTP=',s)
          if s!=200:
              print('SIGNUP_RESULT=',d.get('error',{}).get('message','UNKNOWN'))
              raise SystemExit(0)
          token=d['idToken']; uid=d['localId']
          print('AUTH_ACCOUNT_CREATED=YES')
          fs=f'https://firestore.googleapis.com/v1/projects/{project}/databases/(default)/documents/users/{uid}?key={key}'
          s2,d2=call(urllib.request.Request(fs,headers={'Authorization':f'Bearer {token}'}))
          print('SELF_USER_READ_HTTP=',s2)
          print('SELF_USER_READ_STATUS=',d2.get('error',{}).get('status','OK'))
          print('SELF_USER_READ_MESSAGE=',d2.get('error',{}).get('message','OK'))
          delete=f'https://identitytoolkit.googleapis.com/v1/accounts:delete?key={key}'
          b2=json.dumps({'idToken':token}).encode()
          sd,dd=call(urllib.request.Request(delete,data=b2,headers={'Content-Type':'application/json'},method='POST'))
          print('TEMP_ACCOUNT_DELETE_HTTP=',sd)
          PY
